services:
  # 0. High-Speed Redis for LiveKit Session State & SIP Dispatch
  redis:
    image: redis:alpine
    container_name: voice-redis
    restart: unless-stopped
    network_mode: host

  # 1. LiveKit WebRTC Core Server
  livekit-server:
    image: livekit/livekit-server:v1.8.0
    container_name: livekit-server
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  # 2. LiveKit SIP Gateway (Telnyx VoIP)
  livekit-sip:
    image: livekit/sip:v1.3.0
    container_name: livekit-sip
    restart: unless-stopped
    network_mode: host
    command: run --config /etc/sip-config.yaml
    volumes:
      - ./livekit-sip.yaml:/etc/sip-config.yaml
    depends_on:
      - livekit-server
      - redis

  # 3. GPU-Accelerated Voice Agent Worker (CUDA 12.4 + Kokoro + Parakeet)
  voice-agent-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: voice-agent-gpu
    restart: unless-stopped
    command: python agent.py start
    network_mode: host
    environment:
      - LIVEKIT_URL=ws://127.0.0.1:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - BACKEND_API_URL=${BACKEND_API_URL:-https://agents.ibrasoft.com/api/v1}
      - BACKEND_WS_URL=${BACKEND_WS_URL:-wss://agents.ibrasoft.com/api/v1/ws/calls}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LD_LIBRARY_PATH=/usr/local/lib/python3.11/dist-packages/nvidia/cudnn/lib:/usr/local/lib/python3.11/dist-packages/nvidia/cublas/lib:/usr/local/cuda/lib64
      - EXECUTION_DEVICE=cpu
    volumes:
      - ./:/app
      - ./models:/app/models
    depends_on:
      - livekit-server

  # 4. Nginx SSL Gateway (server.ibrasoft.com)
  nginx-proxy:
    image: nginx:alpine
    container_name: voice-nginx-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - livekit-server
