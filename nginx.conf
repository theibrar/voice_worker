# ==============================================================================
# Nginx Reverse Proxy for server.ibrasoft.com
# LiveKit WebRTC Signaling + SIP Audio + REST API Gateway
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Upstream Services
    upstream livekit_ws {
        server 127.0.0.1:7880;
    }

    upstream go_backend {
        server 127.0.0.1:8080;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name server.ibrasoft.com localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server for server.ibrasoft.com
    server {
        listen 443 ssl http2;
        server_name server.ibrasoft.com;

        # SSL Certificates (Let's Encrypt or fallback self-signed)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 1. LiveKit WebRTC WebSocket Signaling (/rtc or /ws)
        location /rtc {
            proxy_pass http://livekit_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 2. Go Backend REST API Proxy (/api/v1)
        location /api/ {
            proxy_pass http://go_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Health check root
        location / {
            proxy_pass http://livekit_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
